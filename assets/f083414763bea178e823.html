<body class="auth-page" data-page="login">
  <div class="sky-glow sky-glow-one" aria-hidden="true"></div>
  <div class="sky-glow sky-glow-two" aria-hidden="true"></div>
  <header class="auth-brand">
    <a href="/" class="brand-lockup" aria-label="返回创作工作台官网">
      <span class="brand-logo-wrap"><img src="/creator-workbench/assets/img/wxgc-ico.png" alt=""></span>
      <span><strong>创作工作台</strong><small>STEADY STEPS · HIGHER GROUND</small></span>
    </a>
  </header>

  <main class="login-layout">
    <section class="login-story" aria-labelledby="story-title">
      <div class="story-copy">
        <span class="eyebrow"><i></i> 会员专属工作台</span>
        <h1 id="story-title">稳步向前，<br><em>抵达更高处。</em></h1>
        <p>课程资料、实战工具与会员服务，集中在一个安静、清晰的空间里。</p>
      </div>
      <div class="journey-art" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="summit-mark"><span>W</span></div>
        <div class="step step-one"></div>
        <div class="step step-two"></div>
        <div class="step step-three"></div>
        <div class="step step-four"></div>
        <div class="floating-note note-one"><i></i><i></i><i></i></div>
        <div class="floating-note note-two">↗</div>
      </div>
      <div class="story-proof"><span>01</span><p><strong>私密访问</strong><small>会员内容经登录鉴权后开放</small></p></div>
    </section>

    <section class="auth-card" aria-labelledby="login-title">
      <div class="card-kicker">WELCOME BACK</div>
      <h2 id="login-title">登录会员中心</h2>
      <p class="card-intro">使用你登记的手机号和已设置的密码</p>
      <form id="login-form" novalidate>
        <label class="field-label" for="phone">手机号</label>
        <div class="input-shell">
          <svg aria-hidden="true"><use href="/wxgc-member/icons.svg#phone"></use></svg>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="username" maxlength="32" placeholder="请输入手机号" required>
        </div>
        <label class="field-label" for="password">密码</label>
        <div class="input-shell">
          <svg aria-hidden="true"><use href="/wxgc-member/icons.svg#lock"></use></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入密码" required>
          <button class="password-toggle" type="button" data-toggle-password="password" aria-label="显示密码">
            <svg aria-hidden="true"><use href="/wxgc-member/icons.svg#eye"></use></svg>
          </button>
        </div>
        <div id="form-message" class="form-message" role="alert" aria-live="polite"></div>
        <div class="login-primary-actions">
          <button class="primary-button" type="submit"><span>进入系统</span><svg aria-hidden="true"><use href="/wxgc-member/icons.svg#arrow"></use></svg></button>
          <a class="member-apply-button" href="/member-apply.html"><span>会员信息补录</span><svg aria-hidden="true"><use href="/wxgc-member/icons.svg#arrow"></use></svg></a>
        </div>
        <a class="wechat-login-button" data-wechat-login href="/api/auth/wechat/start?next=%2Fmember%2F"><span>使用微信登录</span><svg aria-hidden="true"><use href="/wxgc-member/icons.svg#arrow"></use></svg></a>
      </form>
      <div class="auth-help">
        <button type="button" data-show-help>忘记密码？</button>
        <span>首次使用请打开管理员私发的激活链接</span>
      </div>
      <div class="security-note"><svg aria-hidden="true"><use href="/wxgc-member/icons.svg#shield"></use></svg><span>系统只保存不可逆密码哈希，不会留存明文密码</span></div>
    </section>
  </main>

  <footer class="auth-footer"><span>© 2026 创作工作台</span><span class="visit-counter visit-counter--inline" data-vercount-counter="compact" aria-label="网站访问数据" aria-live="polite" hidden><span>本页浏览 <strong data-vercount-page-pv>—</strong> 次</span><span class="visit-counter__separator" aria-hidden="true">·</span><span>全站访问 <strong data-vercount-site-pv>—</strong> 次</span></span><span>会员资料安全访问</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <!-- wxgc-wechat-share:start -->
  <script src="/wxgc-member/wechat-share.js?v=coupon-fields-20261111-full" defer></script>
  <!-- wxgc-wechat-share:end -->
  <script src="/wxgc-member/visit-counter.js?v=coupon-fields-20261111-full" defer></script>
</body>
</html>
